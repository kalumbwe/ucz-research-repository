# Render Blueprint for the UCZ University Research Repository.
# https://render.com/docs/blueprint-spec
#
# In the Render dashboard: New -> Blueprint -> select this repo.
# Render reads this file and provisions the web service and disk.
#
# The Postgres database is deliberately NOT declared here. It is created
# and owned through the dashboard, and DATABASE_URL is set manually
# (sync: false) so that applying this blueprint can never provision a
# second database or repoint the service away from the live one.
# After the first deploy, visit /install.php on your live URL to apply
# the schema and create your admin account.

services:
  - type: web
    name: ucz-research-repository
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz.php
    envVars:
      - key: APP_NAME
        value: "UCZ University Research Repository"
      - key: APP_ENV
        value: production
      - key: APP_URL
        sync: false
      # Internal Database URL of the Postgres instance, pasted in via the
      # dashboard. Must be in the same region as this service — Render's
      # internal dpg-* hostnames do not resolve across regions.
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_PATH
        value: /var/www/html/storage/uploads
      - key: MAX_UPLOAD_MB
        value: "25"
      # Guards /install.php. Set it only while installing, then remove it.
      - key: INSTALL_KEY
        sync: false
    disk:
      name: uploads
      mountPath: /var/www/html/storage/uploads
      sizeGB: 5
