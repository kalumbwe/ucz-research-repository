# Render Blueprint for the UCZ University Research Repository.
# https://render.com/docs/blueprint-spec
#
# In the Render dashboard: New -> Blueprint -> select this repo.
# Render reads this file and provisions the web service, database
# and disk together. After the first deploy, visit /install.php on
# your live URL to apply the schema and create your admin account.

databases:
  - name: ucz-research-db
    databaseName: ucz_research
    plan: starter
    region: frankfurt

services:
  - type: web
    name: ucz-research-repository
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz.php
    envVars:
      - key: APP_NAME
        value: "UCZ University Research Repository"
      - key: APP_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ucz-research-db
          property: connectionString
      - key: STORAGE_PATH
        value: /var/www/html/storage/uploads
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: INSTALL_KEY
        generateValue: true
    disk:
      name: uploads
      mountPath: /var/www/html/storage/uploads
      sizeGB: 5
